<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Alunos</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Cadastro de Alunos</h1>

        <form id="formAluno">

            <label>Nome</label>
            <input type="text" id="nome" placeholder="Digite o nome do aluno" required>

            <label>Idade</label>
            <input type="number" id="idade" placeholder="Digite a idade" required>

            <button type="submit">Cadastrar</button>

        </form>

        <h2>Alunos Cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaAlunos">

            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
